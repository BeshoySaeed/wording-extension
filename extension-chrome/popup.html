<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Figma Node Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0c0e;
      --surface:   #141417;
      --border:    #2a2a30;
      --border-hi: #3f3f48;
      --accent:    #a78bfa;
      --accent2:   #7c3aed;
      --text:      #e8e8f0;
      --muted:     #6b6b7e;
      --success:   #34d399;
      --error:     #f87171;
      --mono:      'Space Mono', monospace;
      --sans:      'DM Sans', sans-serif;
    }

    body {
      width: 400px;
      min-height: 260px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #141417 0%, #1a1420 100%);
    }
    .header-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .header-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .header-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── Form ── */
    .form-body {
      padding: 16px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field label {
      font-size: 10px;
      font-family: var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    .field input::placeholder { color: var(--muted); }
    .field input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.18);
    }
    .field input.error-input {
      border-color: var(--error);
    }

    /* ── Button ── */
    .btn-row {
      display: flex;
      gap: 8px;
      padding: 0 18px 16px;
    }
    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: none;
      border-radius: 7px;
      padding: 9px 14px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #fff;
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      flex: 0 0 auto;
      padding: 9px 12px;
    }
    .btn-secondary:hover { border-color: var(--border-hi); color: var(--text); }

    /* ── Spinner ── */
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner { display: block; }
    .loading .btn-label { display: none; }

    /* ── Status bar ── */
    .status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
    }
    .status-bar.visible { display: flex; }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-bar.ok .status-dot { background: var(--success); }
    .status-bar.err .status-dot { background: var(--error); }
    .status-bar.ok { color: var(--success); }
    .status-bar.err { color: var(--error); }

    /* ── Result panel ── */
    #result-panel {
      display: none;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }
    #result-panel.visible { display: flex; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .result-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .result-meta span { color: var(--accent); }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      padding: 4px 9px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }

    #json-output {
      max-height: 280px;
      overflow-y: auto;
      padding: 14px 18px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.7;
      white-space: pre;
      background: var(--bg);
      color: var(--text);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #json-output::-webkit-scrollbar { width: 5px; }
    #json-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* JSON syntax highlighting */
    .json-key    { color: #a78bfa; }
    .json-str    { color: #86efac; }
    .json-num    { color: #fbbf24; }
    .json-bool   { color: #60a5fa; }
    .json-null   { color: var(--muted); }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 18px;
      opacity: 0.5;
    }

    /* ── Fade-in animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.22s ease both; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">⬡</div>
    <div>
      <div class="header-title">FOXTROT FIMGA_WORDING</div>
      <div class="header-sub">Fetch page nodes via REST API</div>
    </div>
  </div>

  <!-- Form -->
  <div class="form-body" id="form-body">
    <div class="field">
      <label>API Key</label>
      <input type="password" id="api-key" placeholder="figd_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
    </div>
    <div class="field">
      <label>File ID</label>
      <input type="text" id="file-id" placeholder="aBcDeFgHiJkL..." autocomplete="off" />
    </div>
    <div class="field">
      <label>Page ID</label>
      <input type="text" id="page-id" placeholder="1:2 or 123:456" autocomplete="off" />
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" id="fetch-btn">
      <div class="spinner"></div>
      <span class="btn-label">Fetch Nodes</span>
    </button>
    <button class="btn btn-secondary" id="clear-btn" title="Clear saved inputs">✕</button>
  </div>

  <!-- Status bar -->
  <div class="status-bar" id="status-bar">
    <div class="status-dot"></div>
    <span id="status-msg"></span>
  </div>

  <!-- Result panel -->
  <div id="result-panel">
    <div class="result-header">
      <div class="result-meta">page: <span id="page-name-label">—</span></div>
      <button class="copy-btn" id="copy-btn">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V5.414L11.586 2H9a2 2 0 0 0-2 2v1H4zm5 0v1a1 1 0 0 1-1 1H5V4a1 1 0 0 1 1-1h3z"/>
        </svg>
        <span class="copy-label">Copy JSON</span>
      </button>
    </div>
    <div id="json-output"></div>
  </div>

  <script src="wording-processor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
